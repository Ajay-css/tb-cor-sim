<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">

    <title>
        Final Results
    </title>

    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {

            background: #ffffff;

            height: 100vh;

            overflow: hidden;

            padding: 25px;
        }

        .container {

            height: 100%;

            max-width: 1500px;

            margin: auto;

            display: flex;

            flex-direction: column;

            justify-content: space-between;
        }

        /* ===================== */
        /* HERO */
        /* ===================== */

        .hero-card {

            text-align: center;
        }

        .hero-card h1 {

            font-size: 58px;

            color: #13233E;

            font-weight: 800;

            margin-bottom: 10px;
        }

        .hero-card p {

            color: #64748B;

            font-size: 18px;
        }

        /* ===================== */
        /* PODIUM */
        /* ===================== */

        .podium-layout {

            display: flex;

            justify-content: center;

            align-items: flex-end;

            gap: 24px;

            flex: 1;
        }

        .team-card {

            width: 270px;

            text-align: center;

            border-radius: 26px;

            padding: 24px;

            background: white;

            box-shadow:
                0 15px 40px rgba(15,
                    23,
                    42,
                    .06);
        }

        .team-card:first-child {

            min-height: 260px;

            border:
                2px solid #FFD54F;

            background:
                linear-gradient(180deg,
                    #FFFBEA,
                    #FFFFFF);
        }

        .team-card:nth-child(2) {

            min-height: 210px;
        }

        .team-card:nth-child(3) {

            min-height: 180px;
        }

        .rank-badge {

            width: 64px;

            height: 64px;

            margin: auto;

            border-radius: 50%;

            display: flex;

            justify-content: center;

            align-items: center;

            font-size: 28px;

            font-weight: 700;

            color: white;

            margin-bottom: 20px;
        }

        .gold {
            background: #F5B301;
        }

        .silver {
            background: #94A3B8;
        }

        .bronze {
            background: #CD7F32;
        }

        .team-card h3 {

            color: #13233E;

            font-size: 24px;

            margin-bottom: 16px;
        }

        .score {

            color: #4F7FFF;

            font-size: 42px;

            font-weight: 800;

            margin-bottom: 10px;
        }

        .rating {

            color: #64748B;
        }

        /* ===================== */
        /* FOOTER */
        /* ===================== */

        .footer-section {

            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 20px;

            margin-top: 30px;
        }

        .thank-card {

            flex: 1;

            background: white;

            padding: 24px;

            border-radius: 24px;

            box-shadow:
                0 15px 40px rgba(15,
                    23,
                    42,
                    .05);
        }

        .thank-card h2 {

            color: #13233E;

            margin-bottom: 8px;
        }

        .thank-card p {

            color: #64748B;
        }

        .home-btn {

            border: none;

            padding: 18px 34px;

            border-radius: 18px;

            color: white;

            font-size: 17px;

            font-weight: 700;

            cursor: pointer;

            background:
                linear-gradient(135deg,
                    #4F7FFF,
                    #8B7BFF);

            box-shadow:
                0 15px 35px rgba(79,
                    127,
                    255,
                    .25);
        }
    </style>

</head>

<body>

    <div class="container">

        <div class="hero-section">

            <div class="hero-card">

                <h1>

                    Challenge Completed.

                </h1>

                <p id="totalTeams">

                    Loading...

                </p>

            </div>

        </div>

        <div class="podium-section">

            <div id="topThree" class="podium-layout">

                Loading Results...

            </div>

        </div>

        <div class="footer-section">

            <div class="thank-card">

                <h2>

                    Thank You For Participating

                </h2>

                <p>

                    We hope your team enjoyed the experience.

                </p>

            </div>

            <button class="home-btn" onclick="goHome()">

                Back To Home

            </button>

        </div>

    </div>


    <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>

    <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-database-compat.js"></script>

    <script src="js/firebase-config.js"></script>

    <script>

        function playSound(file) {

            const audio = new Audio(
                "assets/audio/" + file
            );

            audio.volume = 0.5;

            audio.play();

        }

        const params =
            new URLSearchParams(
                window.location.search
            );

        const roomCode =
            params.get("room");



        function loadResults() {

            Promise.all([

                db.ref(
                    "rooms/" +
                    roomCode +
                    "/scores"
                ).once("value"),

                db.ref(
                    "rooms/" +
                    roomCode +
                    "/teams"
                ).once("value")

            ])

                .then(([scoresSnap, teamsSnap]) => {

                    const scores =
                        scoresSnap.val();

                    const teams =
                        teamsSnap.val();



                    const totalTeams =

                        teams
                            ? Object.keys(
                                teams
                            ).length
                            : 0;



                    document
                        .getElementById(
                            "totalTeams"
                        )
                        .innerText =

                        totalTeams +
                        " Teams Participated";



                    if (!scores) {

                        document
                            .getElementById(
                                "topThree"
                            )
                            .innerHTML =

                            "No Scores Found";

                        return;

                    }



                    const teamArray =

                        Object.values(
                            scores
                        );



                    teamArray.sort(

                        (a, b) =>

                            b.totalScore -
                            a.totalScore

                    );



                    let html = "";



                    const topThree =

                        teamArray.slice(
                            0,
                            3
                        );



                    topThree.forEach(

                        (team, index) => {
                            const classes = [
                                "gold",
                                "silver",
                                "bronze"
                            ];

                            html += `
<div class="team-card">

    <div class="rank-badge ${classes[index]}">

        ${index + 1}

    </div>

    <h3>

        ${team.teamName}

    </h3>

    <div class="score">

        ${team.totalScore}

    </div>

    <div class="rating">

        ${team.rating}

    </div>

</div>
`;
                        });



                    document
                        .getElementById(
                            "topThree"
                        )
                        .innerHTML =
                        html;

                });

        }



        function goHome() {

            window.location.href =
                "index.html";

        }

        loadResults();

    </script>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

    <script>

        window.onload = () => {

            const duration = 2500;

            const end =
                Date.now() + duration;

            const interval =
                setInterval(() => {

                    if (
                        Date.now() > end
                    ) {

                        clearInterval(
                            interval
                        );

                        return;
                    }

                    confetti({

                        particleCount: 3,

                        startVelocity: 25,

                        spread: 60,

                        origin: {

                            x: Math.random(),

                            y: 0

                        }

                    });

                }, 120);

        };

    </script>

</body>

</html>
