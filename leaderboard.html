<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">

    <title>Leaderboard</title>

    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {

            background: #ffffff;

            height: 100vh;

            overflow: hidden;

            padding: 20px;
        }

        .container {

            max-width: 1500px;

            height: 100%;

            margin: auto;

            display: flex;

            flex-direction: column;

            gap: 18px;
        }

        /* ========================= */
        /* HEADER */
        /* ========================= */

        .header-card {

            text-align: center;
        }

        .header-card h1 {

            font-size: 48px;

            color: #13233E;

            font-weight: 800;

            margin-bottom: 8px;
        }

        .header-card p {

            color: #64748B;

            font-size: 16px;
        }

        /* ========================= */
        /* PODIUM */
        /* ========================= */

        .podium-layout {

            display: flex;

            justify-content: center;

            align-items: flex-end;

            gap: 22px;

            min-height: 220px;
        }

        .rank-card {

            width: 240px;

            padding: 20px;

            border-radius: 24px;

            text-align: center;

            background: white;

            box-shadow:
                0 15px 40px rgba(15,
                    23,
                    42,
                    .06);

            transition: .25s ease;
        }

        .rank-card:hover {

            transform:
                translateY(-4px);
        }

        .rank-1 {

            min-height: 220px;

            border:
                2px solid #FFD54F;

            background:
                linear-gradient(180deg,
                    #FFFBEA,
                    #FFFFFF);
        }

        .rank-2 {

            min-height: 180px;
        }

        .rank-3 {

            min-height: 150px;
        }

        .rank-label {

            width: 60px;

            height: 60px;

            margin: auto;

            border-radius: 50%;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 28px;

            font-weight: 700;

            color: white;

            margin-bottom: 20px;
        }

        .rank-1 .rank-label {

            background: #F5B301;
        }

        .rank-2 .rank-label {

            background: #94A3B8;
        }

        .rank-3 .rank-label {

            background: #CD7F32;
        }

        .team-name {

            font-size: 22px;

            font-weight: 700;

            color: #13233E;

            margin-bottom: 12px;
        }

        .team-score {

            font-size: 40px;

            color: #4F7FFF;

            font-weight: 800;
        }

        /* ========================= */
        /* LOWER SECTION */
        /* ========================= */

        .bottom-section {

            flex: 1;

            display: grid;

            grid-template-columns:
                2fr 1fr;

            gap: 18px;

            min-height: 0;
        }

        /* ========================= */
        /* WINNER CARD */
        /* ========================= */

        .winner-card {

            padding: 24px;

            background: white;

            border-radius: 26px;

            box-shadow:
                0 15px 40px rgba(15,
                    23,
                    42,
                    .05);

            overflow: auto;
        }

        .winner-card h2 {

            color: #13233E;

            margin-bottom: 10px;

            font-size: 30px;
        }

        .winner-card h3 {

            color: #13233E;

            margin-top: 18px;

            margin-bottom: 10px;
        }

        .winner-card p {

            color: #475569;

            line-height: 1.7;
        }

        .winner-card ul {

            margin-left: 24px;

            line-height: 1.9;
        }

        .winner-card li {

            color: #475569;
        }

        .winner-card pre {

            background: #F8FAFF;

            border-radius: 18px;

            padding: 18px;

            white-space: pre-wrap;

            line-height: 1.7;

            border:
                1px solid rgba(79,
                    127,
                    255,
                    .08);
        }

        /* ========================= */
        /* ACTION CARD */
        /* ========================= */

        .action-card {

            display: flex;

            flex-direction: column;

            justify-content: center;

            align-items: center;

            background: white;

            border-radius: 26px;

            box-shadow:
                0 15px 40px rgba(15,
                    23,
                    42,
                    .05);
        }

        .next-btn {

            border: none;

            cursor: pointer;

            padding: 18px 34px;

            border-radius: 18px;

            color: white;

            font-size: 17px;

            font-weight: 700;

            background:
                linear-gradient(135deg,
                    #4F7FFF,
                    #8B7BFF);

            box-shadow:
                0 15px 35px rgba(79,
                    127,
                    255,
                    .25);

            transition: .25s ease;
        }

        .next-btn:hover {

            transform:
                translateY(-3px);
        }

        /* ========================= */
        /* SCROLLBAR */
        /* ========================= */

        ::-webkit-scrollbar {

            width: 8px;
        }

        ::-webkit-scrollbar-thumb {

            background: #dbe4ff;

            border-radius: 20px;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="header-card">

            <h1>

                Results Are In.

            </h1>

            <p>

                Performance summary for this round.

            </p>

        </div>

        <div id="leaderboard" class="podium-layout">

            Loading...

        </div>

        <div class="bottom-section">

            <div class="winner-card" id="winnerDetails">

                Loading Winner...

            </div>

            <div class="action-card">

                <button class="next-btn" onclick="goBackToGame()">

                    Next Scenario

                </button>

            </div>

        </div>

    </div>


    <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>

    <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-database-compat.js"></script>

    <script src="js/firebase-config.js"></script>
    <script src="js/scenarios.js"></script>

    <script>

        function playSound(file) {

            const audio = new Audio(
                "assets/audio/" + file
            );

            audio.volume = 0.5;

            audio.play();

        }

        const params =
            new URLSearchParams(
                window.location.search
            );

        const roomCode =
            params.get("room");



        function loadLeaderboard() {

            db.ref(
                "rooms/" +
                roomCode +
                "/scores"
            )
                .once("value")
                .then(snapshot => {

                    const data =
                        snapshot.val();

                    if (!data) {

                        document
                            .getElementById(
                                "leaderboard"
                            )
                            .innerHTML =
                            "No Scores Found";

                        return;
                    }

                    const teams =
                        Object.values(data);



                    teams.sort(

                        (a, b) =>

                            b.totalScore -
                            a.totalScore

                    );



                    let html = "";



                    teams.forEach(
                        (team, index) => {
                            const medals = [
                                "#1",
                                "#2",
                                "#3"
                            ];

                            html = teams
                                .slice(0, 3)
                                .map((team, index) => `

<div class="rank-card rank-${index + 1}">

    <div class="rank-label">

        ${medals[index]}

    </div>

    <div class="team-name">

        ${team.teamName}

    </div>

    <div class="team-score">

        ${team.totalScore}

    </div>

</div>

`)
                                .join("");

                            document
                                .getElementById(
                                    "leaderboard"
                                )
                                .innerHTML =
                                html;
                        }
                    );



                    document
                        .getElementById(
                            "leaderboard"
                        )
                        .innerHTML =
                        html;



                    showWinner(
                        teams[0]
                    );

                    playSound(
                        "results-chime.wav"
                    );

                });

        }



        function showWinner(team) {

            if (!team)
                return;

            let strengthsHtml = "";

            if (
                team.strengths &&
                team.strengths.length
            ) {

                strengthsHtml =
                    "<ul>";

                team.strengths
                    .forEach(item => {

                        strengthsHtml +=

                            `<li>${item}</li>`;

                    });

                strengthsHtml +=
                    "</ul>";
            }



            document
                .getElementById(
                    "winnerDetails"
                )
                .innerHTML =

                `

<h2>

${team.teamName}

</h2>

<p>

Total Score :
<b>
${team.totalScore}
</b>

</p>

<br>

<h3>

Why They Won

</h3>

${strengthsHtml}

<br>

<h3>

Best Response

</h3>

<pre>

${team.bestResponse || "No response stored"}

</pre>

`;

        }

        async function goBackToGame() {

            try {

                const roomSnapshot =
                    await db.ref(
                        "rooms/" +
                        roomCode
                    ).once("value");

                const room =
                    roomSnapshot.val();

                let currentIndex;

                do {

                    currentIndex = Math.floor(
                        Math.random() *
                        SCENARIOS.length
                    );

                }
                while (
                    currentIndex ===
                    room.currentScenarioIndex
                );

                if (
                    currentIndex >=
                    SCENARIOS.length
                ) {

                    alert(
                        "🎉 All scenarios completed!"
                    );

                    return;
                }

                console.log(
                    "Current Index:",
                    currentIndex
                );

                console.log(
                    SCENARIOS[currentIndex]
                );

                const nextScenario =
                    SCENARIOS[currentIndex];

                console.log(
                    "Current Index:",
                    currentIndex
                );

                console.log(
                    SCENARIOS[currentIndex]
                );

                await db.ref(
                    "rooms/" +
                    roomCode
                )
                    .update({

                        currentScenarioIndex:
                            currentIndex,

                        currentQuestion:
                            nextScenario.question,

                        responses:
                            null,

                        timer:
                            90

                    });

                window.location.href =
                    "scenario.html?room=" +
                    roomCode +
                    "&role=host";

            }
            catch (error) {

                console.error(error);

            }

        }

        loadLeaderboard();

    </script>

</body>

</html>
